[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "place-service"
version = "1.0.0"
description = "City Vibe place-service — справочник городов"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Anton Itskovich" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../..", "../../.."]

[tool.ruff]
line-length = 120
target-version = "py312"
