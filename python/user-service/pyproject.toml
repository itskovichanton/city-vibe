[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "user-service"
version = "1.0.0"
description = "City Vibe user-service — профили и онбординг"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Anton Itskovich" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aio-pika>=9.4",
  "boto3>=1.34",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "datamodel-code-generator>=0.25",
  "openapi-python-client>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../..", "../../.."]

[tool.ruff]
line-length = 120
target-version = "py312"
