[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-gateway"
version = "1.0.0"
description = "City Vibe API Gateway — reverse proxy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
