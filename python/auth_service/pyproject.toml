[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-service"
version = "1.0.0"
description = "City Vibe auth-service — регистрация, логин, OTP, JWT"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Anton Itskovich" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aio-pika>=9.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "redis>=5.0",
  "pwdlib[argon2]>=0.2",
  "PyJWT>=2.8",
  "phonenumbers>=8.13",
  "email-validator>=2.1",
  "google-auth>=2.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "fakeredis>=2.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../..", "../../.."]

[tool.ruff]
line-length = 120
target-version = "py312"
