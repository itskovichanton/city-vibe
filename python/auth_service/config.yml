app:
  version: 1.0.0
  name: auth-service

server:
  host: 0.0.0.0
  port: 8082

db:
  url: postgresql+asyncpg://cityvibe:cityvibe@localhost:5432/cityvibe_auth
  echo: false
  pool_size: 5

rabbitmq:
  url: amqp://cityvibe:cityvibe@localhost:5672/
  exchange: city_vibe.events

redis:
  host: localhost
  port: 6379

auth:
  # Секрет для JWT access/refresh (в prod — из ENV)
  jwt_secret: dev-jwt-secret-change-me
  access_ttl_min: 15
  refresh_ttl_days: 30
  otp_ttl_sec: 300
  # Google OAuth client ids (audience для verify_oauth2_token)
  google_client_ids:
    - "your-google-client-id.apps.googleusercontent.com"

clients:
  user_service:
    url: http://localhost:8081
    auth:
      session_token: dev-s2s-token
  auth_service:
    url: http://localhost:8082
    auth:
      session_token: dev-s2s-token
  place_service:
    url: http://localhost:8083
  design_service:
    url: http://localhost:8085
  notification_service:
    url: http://localhost:8084
  mock_notify:
    url: http://localhost:8090
  api_gateway:
    url: http://localhost:8080

loggers:
  sql:
    backup_count: 3
  http:
    backup_count: 3

dev:
  server:
    port: 8082
  db:
    echo: true

prod:
  server:
    port: 8082
  db:
    echo: false
