app:
  version: 1.0.0
  name: user-service

server:
  host: 0.0.0.0
  port: 8081

db:
  url: postgresql+asyncpg://cityvibe:cityvibe@localhost:5432/cityvibe_users
  echo: false
  pool_size: 5

rabbitmq:
  url: amqp://cityvibe:cityvibe@localhost:5672/
  exchange: city_vibe.events

s3:
  endpoint_url: http://localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: city-vibe
  region: us-east-1
  # avatar_url в БД — S3-ключ (avatars/...). Файлы: GET /media/{key} через gateway.

redis:
  host: localhost
  port: 6379

# HTTP-клиенты к нашим микросервисам (on_mbclient_api → MBClientConfig)
# session_token уходит как sessionToken — S2S middleware его принимает
clients:
  user_service:
    url: http://localhost:8081
    auth:
      session_token: dev-s2s-token
  auth_service:
    url: http://localhost:8082
    auth:
      session_token: dev-s2s-token
  place_service:
    url: http://localhost:8083
  design_service:
    url: http://localhost:8085
  notification_service:
    url: http://localhost:8084
  mock_notify:
    url: http://localhost:8090
  api_gateway:
    url: http://localhost:8080

email:
  from_address: noreply@cityvibe.local
  username: ""
  password: ""
  host: localhost
  address: localhost
  port: 25
  encoding: utf-8

alerts:
  emails: [ ]

loggers:
  sql:
    backup_count: 7
  http:
    backup_count: 7
    level: INFO

# Профиль dev (обязателен для YamlConfigLoaderServiceImpl)
dev:
  server:
    port: 8081
  db:
    echo: true

# Профиль prod — переопределения для продакшена
prod:
  server:
    port: 8081
  db:
    echo: false
