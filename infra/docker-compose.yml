services:
  postgres:
    image: postgres:16-alpine
    container_name: cityvibe-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cityvibe
      POSTGRES_PASSWORD: cityvibe
      POSTGRES_DB: cityvibe_users
    volumes:
      - cityvibe_pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityvibe -d cityvibe_users"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cityvibe-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: cityvibe
      RABBITMQ_DEFAULT_PASS: cityvibe
    volumes:
      - cityvibe_rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cityvibe-redis
    ports:
      - "6379:6379"
    volumes:
      - cityvibe_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: cityvibe-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - cityvibe_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  cityvibe_pg_data:
  cityvibe_rabbit_data:
  cityvibe_redis_data:
  cityvibe_minio_data:
